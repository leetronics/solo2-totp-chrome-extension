name: Build Extension

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Validate extension
        run: npm run validate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build extension package
        run: npm run build:zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solokeys-extension-build
          path: |
            solokeys-vault-chrome-*.zip
            solokeys-vault-firefox-*.xpi
            solokeys-vault-chrome-*.crx
            dist/
            dist-firefox/
            INSTALL-*.md
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build release package
        run: npm run build:zip

      - name: Sign Firefox package
        if: ${{ secrets.FIREFOX_AMO_API_KEY != '' && secrets.FIREFOX_AMO_API_SECRET != '' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
        run: npm run sign:firefox

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            solokeys-vault-chrome-*.zip
            solokeys-vault-firefox-*.xpi
            solokeys-vault-firefox-*-signed.xpi
            solokeys-vault-chrome-*.crx
            INSTALL-*.md
          generate_release_notes: true
