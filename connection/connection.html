<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Connect SoloKeys - SoloKeys Vault</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 12px;
        }
        
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        
        .status {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
        }
        
        .status.info {
            background: #e3f2fd;
            color: #1565c0;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: opacity 0.2s, transform 0.1s;
            width: 100%;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            margin-top: 12px;
        }
        
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none !important;
        }
        
        .debug-info {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            color: #666;
        }
        
        .debug-info p {
            margin-bottom: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon" id="icon">🔐</div>
        <h1 id="title">Connect Your SoloKeys</h1>
        <p id="description">Click the button below to select your SoloKeys 2 device</p>
        
        <div class="status info" id="status">
            Ready to connect
        </div>
        
        <div class="spinner hidden" id="spinner"></div>
        
        <button class="btn" id="connectBtn">Select Device</button>
        <button class="btn btn-secondary hidden" id="retryBtn">Try Again</button>
        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
        
        <div class="debug-info" id="debugInfo">
            <p><strong>Debug Info:</strong></p>
            <p id="webhidSupport">WebHID: checking...</p>
            <p id="deviceInfo">Device: not selected</p>
        </div>
    </div>
    
    <script src="connection.js" type="module"></script>
</body>
</html>
