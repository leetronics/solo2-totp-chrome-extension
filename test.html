<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebHID Test - SoloKeys TOTP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #5a6fd6;
        }
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .info { color: #2196f3; }
    </style>
</head>
<body>
    <h1>🔐 SoloKeys WebHID Diagnostic</h1>
    
    <div class="section">
        <h2>1. Check WebHID Support</h2>
        <button onclick="checkSupport()">Check WebHID Support</button>
    </div>
    
    <div class="section">
        <h2>2. List Authorized Devices</h2>
        <button onclick="listDevices()">List All Authorized Devices</button>
    </div>
    
    <div class="section">
        <h2>3. Request SoloKeys Device</h2>
        <button onclick="requestSoloKeys()">Request SoloKeys (Filtered)</button>
        <button onclick="requestAnyDevice()">Request Any HID Device</button>
    </div>
    
    <div class="section">
        <h2>4. Test Connection</h2>
        <button onclick="testConnection()">Test Device Connection</button>
    </div>
    
    <div class="log" id="log">Click a button above to start testing...</div>

    <script>
        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logEl.innerHTML += `[${time}] <span class="${className}">${message}</span>\n`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[${time}] ${message}`);
        }

        async function checkSupport() {
            log('Checking WebHID support...', 'info');
            
            if (!navigator.hid) {
                log('❌ WebHID NOT supported in this browser', 'error');
                log('Please use Chrome 89+ or Edge 89+', 'error');
                return;
            }
            
            log('✓ WebHID API is available', 'success');
            log(`User Agent: ${navigator.userAgent}`, 'info');
        }

        async function listDevices() {
            log('Listing authorized HID devices...', 'info');
            
            if (!navigator.hid) {
                log('❌ WebHID not available', 'error');
                return;
            }
            
            try {
                const devices = await navigator.hid.getDevices();
                log(`Found ${devices.length} authorized device(s)`, 'info');
                
                if (devices.length === 0) {
                    log('No devices found. You need to authorize a device first.', 'error');
                    return;
                }
                
                devices.forEach((device, index) => {
                    log(`\nDevice ${index + 1}:`, 'success');
                    log(`  Name: ${device.productName}`, 'info');
                    log(`  Vendor ID: 0x${device.vendorId.toString(16).padStart(4, '0')}`, 'info');
                    log(`  Product ID: 0x${device.productId.toString(16).padStart(4, '0')}`, 'info');
                    log(`  Opened: ${device.opened}`, 'info');
                });
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function requestSoloKeys() {
            log('Opening device picker with SoloKeys filters...', 'info');
            log('Filters: VID 0x1209 (SoloKeys)', 'info');
            
            if (!navigator.hid) {
                log('❌ WebHID not available', 'error');
                return;
            }
            
            try {
                const devices = await navigator.hid.requestDevice({
                    filters: [
                        { vendorId: 0x1209, productId: 0xBEEE },
                        { vendorId: 0x1209, productId: 0xB000 },
                        { vendorId: 0x1209 }
                    ]
                });
                
                log(`Device picker returned ${devices.length} device(s)`, 'info');
                
                if (devices.length === 0) {
                    log('❌ No device selected or no matching devices found', 'error');
                    log('Make sure your SoloKeys is plugged in', 'error');
                    return;
                }
                
                const device = devices[0];
                log(`✓ Selected: ${device.productName}`, 'success');
                log(`  VID: 0x${device.vendorId.toString(16).padStart(4, '0')}`, 'info');
                log(`  PID: 0x${device.productId.toString(16).padStart(4, '0')}`, 'info');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function requestAnyDevice() {
            log('Opening device picker with NO filters (all HID devices)...', 'info');
            
            if (!navigator.hid) {
                log('❌ WebHID not available', 'error');
                return;
            }
            
            try {
                // Empty filters array shows ALL HID devices
                const devices = await navigator.hid.requestDevice({
                    filters: []
                });
                
                log(`Device picker returned ${devices.length} device(s)`, 'info');
                
                if (devices.length === 0) {
                    log('❌ No device selected', 'error');
                    return;
                }
                
                devices.forEach((device, index) => {
                    log(`\nDevice ${index + 1}:`, 'success');
                    log(`  Name: ${device.productName}`, 'info');
                    log(`  VID: 0x${device.vendorId.toString(16).padStart(4, '0')}`, 'info');
                    log(`  PID: 0x${device.productId.toString(16).padStart(4, '0')}`, 'info');
                });
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testConnection() {
            log('Testing device connection...', 'info');
            
            const devices = await navigator.hid.getDevices();
            if (devices.length === 0) {
                log('❌ No authorized devices. Request one first.', 'error');
                return;
            }
            
            const device = devices[0];
            log(`Testing connection to ${device.productName}...`, 'info');
            
            try {
                if (!device.opened) {
                    await device.open();
                    log('✓ Device opened successfully', 'success');
                } else {
                    log('✓ Device already open', 'success');
                }
                
                // Try to send a simple CTAPHID init command
                log('Sending CTAPHID INIT command...', 'info');
                
                const CID_BROADCAST = 0xffffffff;
                const CMD_INIT = 0x06;
                const nonce = crypto.getRandomValues(new Uint8Array(8));
                
                // Build CTAPHID initialization packet
                const packet = new Uint8Array(64);
                packet[0] = (CID_BROADCAST >> 24) & 0xFF;
                packet[1] = (CID_BROADCAST >> 16) & 0xFF;
                packet[2] = (CID_BROADCAST >> 8) & 0xFF;
                packet[3] = CID_BROADCAST & 0xFF;
                packet[4] = CMD_INIT | 0x80;
                packet[5] = 0x00;
                packet[6] = 0x08;
                packet.set(nonce, 7);
                
                await device.sendReport(0, packet);
                log('✓ Command sent, waiting for response...', 'success');
                
                const response = await device.receiveInputReport();
                log('✓ Got response!', 'success');
                log(`  Response length: ${response.data.length} bytes`, 'info');
                
            } catch (error) {
                log(`❌ Connection error: ${error.message}`, 'error');
            }
        }
        
        // Auto-check support on load
        checkSupport();
    </script>
</body>
</html>
