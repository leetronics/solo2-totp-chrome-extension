<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="80" fill="url(#grad)"/>
  <!-- Font Awesome 5 Solid Clock - simplified representation -->
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="white" stroke-width="48"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="24" fill="white"/>
  <!-- Hour hand (pointing up-left) -->
  <line x1="256" y1="256" x2="200" y2="145" stroke="white" stroke-width="40" stroke-linecap="round"/>
  <!-- Minute hand (pointing right) -->
  <line x1="256" y1="256" x2="356" y2="256" stroke="white" stroke-width="40" stroke-linecap="round"/>
</svg>